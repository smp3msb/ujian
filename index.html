<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ujian Online SMPN 3 Satap Masamba</title>
    
    <style>
        /* Reset CSS & Fullscreen Layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container iframe */
        .app-container {
            width: 100%;
            height: 100vh;
            border: none;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Overlay Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Spinner Animation */
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            margin-top: 16px;
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading" class="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Memuat Sistem Ujian...</div>
    </div>

    <!-- Web App Container -->
    <div class="app-container">
        <iframe 
            id="gas-app"
            src="https://script.google.com/macros/s/AKfycbz3N3yfgLkUE9CFYWlVrXRy4A6h7jFtr2AGYf1pwZqGk0lVOok0wSemyCp_y2L7B0bb/exec"
            allow="geolocation; microphone; camera; clipboard-write;"
            sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
            onload="hideLoading()">
        </iframe>
    </div>

    <script>
        function hideLoading() {
            const loader = document.getElementById('loading');
            if (loader) {
                loader.classList.add('hidden');
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 400);
            }
        }

        // Fallback loader jika respon lambat
        setTimeout(hideLoading, 8000);
    </script>
</body>
</html>
